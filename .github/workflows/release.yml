name: Release packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already-versioned packages after all readiness gates pass
        type: boolean
        required: true
        default: false
permissions:
  contents: write
  id-token: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify publication prerequisites
        run: pnpm release:check
      - name: Run all tests and architecture gates
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build all packages and consumers
        run: pnpm build
      - name: Publish packages
        if: ${{ inputs.publish }}
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
