name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify generated AI context is current
        run: pnpm agent:check
      - name: Run deterministic package and architecture tests
        run: pnpm test:pure
      - name: Run package, AI, export, CSS, documentation, and syntax gates
        run: pnpm verify
      - name: Typecheck all workspaces
        run: pnpm typecheck
      - name: Build packages and every consumer surface
        run: pnpm build
      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcandy-storybook
          path: apps/docs/storybook-static
          if-no-files-found: ignore
