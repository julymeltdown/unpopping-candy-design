name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package exports required by downstream workspaces
        run: pnpm build:packages
      - name: Verify generated AI context is current
        run: pnpm agent:check
      - name: Run deterministic package and architecture tests
        run: pnpm test:pure:source
      - name: Run package, AI, export, CSS, documentation, and syntax gates
        run: pnpm verify
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Storybook interactions and accessibility checks
        run: pnpm test:storybook
      - name: Run cross-browser Storybook smoke tests
        run: pnpm test:browser
      - name: Typecheck all workspaces
        run: pnpm typecheck
      - name: Build packages and every consumer surface
        run: pnpm build
      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcandy-storybook
          path: apps/docs/storybook-static
          if-no-files-found: ignore
